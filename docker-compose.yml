services:
  db:
    image: postgres:16-alpine
    container_name: nexus_cms_db
    restart: always
    environment:
      POSTGRES_USER: nexus_user
      POSTGRES_PASSWORD: nexus_password
      POSTGRES_DB: nexus_cms
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus_user -d nexus_cms"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus_cms_web
    restart: always
    environment:
      DATABASE_URL: "postgresql://nexus_user:nexus_password@db:5432/nexus_cms?schema=public"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXTAUTH_SECRET: "nexus-super-secret-production-auth-key-change-me"
      AUTH_SECRET: "nexus-super-secret-production-auth-key-change-me"
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
